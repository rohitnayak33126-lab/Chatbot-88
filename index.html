<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohit AI Chatbot</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #10172a, #253b70);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

.chat-container {
    width: 100%;
    max-width: 430px;
    height: 650px;
    max-height: 90vh;
    background: #ffffff;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 10px 40px #0005;
}

.header {
    background: #1769ff;
    padding: 20px;
    text-align: center;
}

.header h2 {
    margin: 0 0 6px;
}

.header p {
    margin: 0;
    font-size: 13px;
}

#chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f3f6fc;
}

.message {
    padding: 11px 14px;
    margin: 10px 0;
    border-radius: 15px;
    max-width: 85%;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.bot {
    background: #e0e9ff;
    color: #152443;
    align-self: flex-start;
}

.user {
    background: #1769ff;
    color: white;
    margin-left: auto;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 12px;
    background: white;
    border-top: 1px solid #ddd;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 25px;
    outline: none;
    font-size: 15px;
}

button {
    border: none;
    background: #1769ff;
    color: white;
    padding: 0 17px;
    border-radius: 25px;
    font-size: 17px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

.footer {
    color: #666;
    background: white;
    text-align: center;
    font-size: 11px;
    padding: 7px;
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>🤖 Rohit AI</h2>
        <p>आपका अपना AI Chatbot</p>
    </div>

    <div id="chat-box">
        <div class="message bot">
            नमस्ते! 👋 मैं Rohit AI हूँ।
            मुझसे हिंदी या अंग्रेजी में कुछ भी पूछो!
        </div>
    </div>

    <form class="input-area" id="chat-form">
        <input
            type="text"
            id="user-input"
            placeholder="यहाँ अपना मैसेज लिखें..."
            autocomplete="off"
            required
        >
        <button type="submit" id="send-btn">➤</button>
    </form>

    <div class="footer">
        Created by Rohit Nayak
    </div>

</div>

<script>
const chatBox = document.getElementById("chat-box");
const form = document.getElementById("chat-form");
const input = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
    return message;
}

function getReply(text) {
    const msg = text.toLowerCase().trim();

    if (msg.includes("नमस्ते") ||
        msg.includes("hello") ||
        msg.includes("hi")) {
        return "नमस्ते! 😊 बताओ, मैं तुम्हारी क्या मदद कर सकता हूँ?";
    }

    if (msg.includes("नाम") ||
        msg.includes("name")) {
        return "मेरा नाम Rohit AI है। 🤖";
    }

    if (msg.includes("कौन") ||
        msg.includes("who are you")) {
        return "मैं Rohit AI हूँ, तुम्हारा चैटबॉट!";
    }

    if (msg.includes("github")) {
        return "GitHub पर तुम अपनी वेबसाइट और चैटबॉट होस्ट कर सकते हो।";
    }

    if (msg.includes("धोनी") ||
        msg.includes("dhoni")) {
        return "एम.एस. धोनी भारत के प्रसिद्ध क्रिकेटर और पूर्व कप्तान हैं! 🏏";
    }

    if (msg.includes("मदद") ||
        msg.includes("help")) {
        return "ज़रूर! अपना सवाल लिखो। मैं अपनी जानकारी के अनुसार जवाब दूँगा।";
    }

    if (msg.includes("धन्यवाद") ||
        msg.includes("thank")) {
        return "आपका स्वागत है! 😊";
    }

    if (msg.includes("बाय") ||
        msg.includes("bye")) {
        return "अलविदा! फिर मिलेंगे। 👋";
    }

    return "तुमने पूछा: " + text +
        "\n\nयह अभी एक बेसिक चैटबॉट है। AI से नए जवाब पाने के लिए इसमें AI API जोड़नी होगी।";
}

form.addEventListener("submit", function(event) {
    event.preventDefault();

    const text = input.value.trim();
    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    sendBtn.disabled = true;
    const loading = addMessage("जवाब तैयार कर रहा हूँ...", "bot");

    setTimeout(function() {
        loading.remove();
        addMessage(getReply(text), "bot");
        sendBtn.disabled = false;
        input.focus();
    }, 500);
});
</script>

</body>
  </html>
